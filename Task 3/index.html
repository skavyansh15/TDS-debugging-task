<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO LIST</title>
    <link rel = "stylesheet" href = "style.css"/>
</head>

<body>

    <div class = "container">
        <h1>
            TO-DO LIST📝
        </h1>

        <h3>Never forget any task again✌️</h3>

        <div class = "input-area">
            <input type = "text" id="taskInput" placeholder="Enter the task" />
            <button id="addBtn">Add Task</button>
        </div>  

        <p id="counter">You have 0 tasks left</p>

        <ul id="taskList">   </ul>
        <p id="emptylistmsg">Add your first task  now!</p>
        <button id = "clrbtn">Clear Completed</button>
    </div>
    <script src="script.js"> </script>
</body>
</html>
